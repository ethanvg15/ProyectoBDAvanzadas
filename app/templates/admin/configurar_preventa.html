{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow">
            <div class="card-header bg-dark text-white fw-bold">
                Configurar Preventa de Evento (Administrador)
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('eventos.configurar_preventa') }}">
                    <div class="mb-3">
                        <label for="id_evento" class="form-label fw-bold">Seleccionar Evento del Catálogo</label>
                        <select class="form-select" id="id_evento" name="id_evento" required>
                            <option value="" selected disabled>-- Elija un evento --</option>
                            {% for evento in eventos %}
                                <option value="{{ evento.id_evento }}">
                                    {{ evento.nombre }} ({{ evento.categoria }}) - Actual: ${{ evento.precio }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="precio" class="form-label fw-bold">Precio de Preventa ($)</label>
                        <input type="number" step="0.01" min="0" class="form-control" id="precio" name="precio" placeholder="Ej. 45.00" required>
                    </div>

                    <div class="mb-3">
                        <label for="cantidad" class="form-label fw-bold">Cantidad de Entradas para Preventa</label>
                        <input type="number" min="1" class="form-control" id="cantidad" name="cantidad" placeholder="Ej. 50" required>
                    </div>

                    <div class="mb-3">
                        <label for="duracion_segundos" class="form-label fw-bold">Duración de la Preventa (en segundos - TTL Redis)</label>
                        <input type="number" min="10" class="form-control" id="duracion_segundos" name="duracion_segundos" value="300" required>
                        <div class="form-text">Ejemplo: 300 segundos = 5 minutos de preventa activa.</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold">
                        Publicar Preventa
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
