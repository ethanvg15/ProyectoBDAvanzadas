{% extends "base.html" %}

{% block title %}Obtener Entrada{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="card shadow border-0">
            <div class="card-header bg-dark text-white fw-bold">
                Obtener una entrada
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('entradas.obtener_entrada') }}">
                    <div class="mb-4">
                        <label for="nombre_cliente" class="form-label fw-bold">Nombre del cliente</label>
                        <input type="text" class="form-control" id="nombre_cliente" name="nombre_cliente"
                               value="{{ nombre }}" maxlength="80" placeholder="Ej. Ana Torres" required>
                    </div>

                    <p class="fw-bold mb-2">Preventas abiertas</p>
                    {% if preventas %}
                    <div class="list-group mb-4">
                        {% for p in preventas %}
                        <label class="list-group-item list-group-item-action d-flex align-items-center gap-3">
                            <input class="form-check-input mt-0" type="radio" name="id_evento"
                                   value="{{ p.id_evento }}" required>
                            <span class="flex-grow-1">{{ p.nombre }}</span>
                            <span class="badge bg-secondary">{{ p.categoria }}</span>
                        </label>
                        {% endfor %}
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Obtener entrada</button>
                    {% else %}
                    <div class="alert alert-warning mb-0">
                        No hay preventas abiertas en este momento.
                    </div>
                    {% endif %}
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
