{% extends "base.html" %}

{% block title %}Carga Inicial - Catálogo de Eventos{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Carga Inicial del Catálogo (MongoDB)</h5>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('eventos.cargar_inicial') }}" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="archivo_json" class="form-label">Seleccione el archivo <code>eventos.json</code>:</label>
                        <input class="form-control" type="file" id="archivo_json" name="archivo_json" accept=".json" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">
                        Cargar a MongoDB
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
